[project]
name = "super-agent-py"
version = "0.1.0"
description = "Agent runtime with a state-machine core, LLM providers, local tools, and a Rich TUI"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.69",
    "httpx>=0.28",
    "lxml>=5.3",
    "openai>=1.109",
    "pyperclip>=1.9",
    "python-dotenv>=1.1",
    "rich>=13.9",
]

[project.scripts]
super-agent = "super_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["super_agent"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.isort]
# Re-exports are written `X as X`, which isort would otherwise split onto one
# line each; keeping them grouped is what makes the alias modules readable.
combine-as-imports = true
known-first-party = ["super_agent", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = ["super_agent", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
